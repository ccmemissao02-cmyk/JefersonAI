name: Gerar APK Jeferson AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura
        run: |
          echo "=== RAIZ ==="
          ls -la
          echo "=== APP ==="
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Estrutura Android OK"

      - name: Aceitar licenças Android
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Android SDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JefersonAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
